<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore Pro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="container nav-content">
      <a href="/" class="logo">
        <i class="fas fa-bolt"></i>
        <span data-i18n="store_name">تك ستور</span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link active" data-i18n="home">الرئيسية</a>
        <a href="/products.html" class="nav-link" data-i18n="products">المنتجات</a>
      </div>
      <div class="nav-actions">
        <button class="lang-toggle" id="langToggle">
          <i class="fas fa-globe"></i>
          <span id="langLabel">EN</span>
        </button>
        <a href="/checkout.html" class="cart-btn">
          <i class="fas fa-shopping-bag"></i>
          <span class="cart-count" id="cartCount">0</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-bg-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>
    <div class="container hero-content">
      <div class="hero-text">
        <h1 class="hero-title">
          <span data-i18n="hero_title">اكتشف أحدث الأجهزة الإلكترونية</span><br>
          <span class="hero-highlight" data-i18n="hero_sub">هواتف وإكسسوارات بأسعار لا تُقاوم</span>
        </h1>
        <a href="/products.html" class="btn btn-primary btn-lg">
          <i class="fas fa-shopping-cart"></i>
          <span data-i18n="start_shopping">ابدأ التسوق</span>
        </a>
      </div>
      <div class="hero-visual">
        <div class="hero-phone">
          <i class="fas fa-mobile-alt"></i>
        </div>
      </div>
    </div>
    <div class="container">
      <div class="hero-stats">
        <div class="stat-card">
          <span class="stat-number" id="productCount">0</span>
          <span class="stat-label" data-i18n="product_c">منتج</span>
        </div>
        <div class="stat-card">
          <span class="stat-number">10K+</span>
          <span class="stat-label" data-i18n="customers">عميل</span>
        </div>
        <div class="stat-card">
          <span class="stat-number">4.9★</span>
          <span class="stat-label" data-i18n="rating">تقييم</span>
        </div>
      </div>
    </div>
  </section>

  <!-- FEATURED -->
  <section class="section featured-section">
    <div class="container">
      <h2 class="section-title">
        <i class="fas fa-star"></i>
        <span data-i18n="featured">منتجات مميزة</span>
      </h2>
      <div class="products-grid" id="featuredProducts">
        <div class="loading-spinner"><div class="spinner"></div></div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer-content">
      <div class="footer-brand">
        <i class="fas fa-bolt"></i>
        <span data-i18n="store_name">تك ستور</span>
      </div>
      <p>&copy; 2026 TechStore Pro. <span data-i18n="footer">جميع الحقوق محفوظة</span></p>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
